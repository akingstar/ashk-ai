<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ashk AI</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<meta name="theme-color" content="#EDF2F4">
<style>
:root{--pearl:#EDF2F4;--ink:#14222E;--brine:#2F6F8F;--mist:#BFE3F0;--ember:#D9573B;--line:#c9d6dc}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--pearl);color:var(--ink);font:17px/1.5 Georgia,"Times New Roman",serif;display:flex;flex-direction:column;max-width:560px;margin:auto;padding:env(safe-area-inset-top) 18px env(safe-area-inset-bottom)}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 0}
h1{font-size:26px;font-weight:600;letter-spacing:.01em}
button{font:inherit;color:inherit;cursor:pointer}
.gear{background:none;border:1px solid var(--line);border-radius:10px;padding:6px 12px;font-size:15px}
#log{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding:8px 0}
.m{max-width:85%;padding:10px 14px;border-radius:14px;overflow-wrap:anywhere}
.u{align-self:flex-end;background:var(--ink);color:var(--pearl);border-bottom-right-radius:4px}
.a{align-self:flex-start;background:#fff;border:1px solid var(--line);border-bottom-left-radius:4px}
.e{align-self:center;color:var(--ember);font-size:15px;text-align:center}
.empty{margin:auto;text-align:center;color:#5d7280;max-width:300px}
#stage{display:flex;flex-direction:column;align-items:center;padding:14px 0 6px}
#orb{width:104px;height:104px;border:0;background:none;position:relative;display:grid;place-items:center}
#orb i{position:absolute;width:70px;height:70px;background:var(--brine);border-radius:50% 50% 50% 0;transform:rotate(-45deg);box-shadow:inset -8px -8px 18px rgba(20,34,46,.35),inset 8px 8px 14px var(--mist);transition:background .3s}
#orb::before,#orb::after{content:"";position:absolute;inset:14px;border-radius:50%;border:2px solid var(--brine);opacity:0}
#stage[data-s=listening] #orb i{background:var(--ember)}
#stage[data-s=listening] #orb::before{animation:rip 1.8s ease-out infinite}
#stage[data-s=listening] #orb::after{animation:rip 1.8s ease-out .9s infinite}
#stage[data-s=listening] #orb::before,#stage[data-s=listening] #orb::after{border-color:var(--ember)}
#stage[data-s=thinking] #orb i{animation:spin 1.2s linear infinite}
#stage[data-s=speaking] #orb i{animation:beat .7s ease-in-out infinite alternate}
@keyframes rip{from{transform:scale(.7);opacity:.7}to{transform:scale(1.5);opacity:0}}
@keyframes spin{to{transform:rotate(315deg)}}
@keyframes beat{to{transform:rotate(-45deg) scale(1.14)}}
@media(prefers-reduced-motion:reduce){#orb *,#orb::before,#orb::after{animation:none!important}}
#hint{font-size:15px;color:#5d7280;margin-top:2px;min-height:24px}
form{display:flex;gap:8px;padding:8px 0 14px}
input{flex:1;font:inherit;padding:11px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);min-width:0}
form button{background:var(--ink);color:var(--pearl);border:0;border-radius:12px;padding:0 18px}
:focus-visible{outline:3px solid var(--brine);outline-offset:2px}
dialog{border:1px solid var(--line);border-radius:16px;padding:20px;background:var(--pearl);color:var(--ink);width:min(92vw,420px);margin:auto}
dialog::backdrop{background:rgba(20,34,46,.4)}
dialog label{display:block;font-size:15px;margin:12px 0 4px}
dialog input{width:100%}
dialog .row{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
dialog button{padding:8px 16px;border-radius:10px;border:1px solid var(--line);background:#fff}
dialog button.p{background:var(--ink);color:var(--pearl);border:0}
.a{white-space:pre-wrap}pre{white-space:pre;overflow-x:auto;background:var(--ink);color:var(--pearl);padding:10px 12px;border-radius:8px;margin:6px 0}code{font-family:ui-monospace,Menlo,monospace;font-size:14px}.a>code,.a code{background:#e3ebee;padding:1px 5px;border-radius:5px}pre code{background:none;padding:0}dialog select{width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:#fff;font:inherit;color:var(--ink)}
</style>
</head>
<body>
<header><h1>Ashk AI</h1><button class="gear" id="gear">Settings</button></header>
<div id="log"></div>
<div id="stage" data-s="idle">
  <button id="orb" aria-label="Bolna shuru ya band karo"><i></i></button>
  <div id="hint">Tap karke bolo</div>
</div>
<form id="f"><input id="t" placeholder="Ya yahan type karo" autocomplete="off"><button>Bhejo</button></form>
<dialog id="dlg">
  <h2 style="font-size:20px">Settings</h2>
  <label for="url">Worker URL</label><input id="url" placeholder="https://ashk-ai-worker.xxxx.workers.dev">
  <label for="key">Key (agar deploy ke time ASHK_KEY set ki thi)</label><input id="key" type="password">
  <label for="model">Model</label><select id="model"><option value="">Auto (Llama 3.3 70B)</option><option value="@cf/qwen/qwen2.5-coder-32b-instruct">Qwen Coder 32B (code ke liye)</option><option value="@cf/deepseek-ai/deepseek-r1-distill-qwen-32b">DeepSeek R1 (gehri soch)</option></select>
  <div class="row"><button id="clr">Chat saaf karo</button><button class="p" id="save">Save</button></div>
</dialog>
<script>
const $=s=>document.querySelector(s);
const ls=(k,v)=>{try{return v===undefined?localStorage.getItem(k):localStorage.setItem(k,v)}catch(e){return null}};
let hist=JSON.parse(ls("hist")||"[]"),on=false,state="idle",stream;
const HINT={idle:"Tap karke bolo",listening:"Sun raha hu... bolo",thinking:"Soch raha hu...",speaking:"Bol raha hu (rokne ke liye tap karo)"};
function setState(s){state=s;$("#stage").dataset.s=s;$("#hint").textContent=HINT[s]}
function md(t){const e=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));return e(t).replace(/```(?:\w+)?\n?([\s\S]*?)```/g,(_,c)=>"<pre><code>"+c+"</code></pre>").replace(/`([^`\n]+)`/g,"<code>$1</code>").replace(/\*\*([^*\n]+)\*\*/g,"<b>$1</b>")}
function add(cls,txt){const d=document.createElement("div");d.className="m "+cls;if(cls==="a")d.innerHTML=md(txt);else d.textContent=txt;$("#log").append(d);d.scrollIntoView({block:"end"})}
function render(){$("#log").innerHTML="";if(!hist.length){$("#log").innerHTML='<p class="empty">Namaste, main Ashk AI hu. Orb dabao aur bolna shuru karo, ya neeche type karo.</p>'}hist.forEach(m=>add(m.role==="user"?"u":"a",m.content))}
function err(e){add("e",String(e.message||e))}
const cfg=()=>({url:(ls("url")||"").replace(/\/$/,""),key:ls("key")||""});
async function api(path,body){
  const {url,key}=cfg();
  if(!url){$("#dlg").showModal();throw new Error("Pehle Settings mein Worker URL daalo")}
  const blob=body instanceof Blob;
  const r=await fetch(url+path,{method:"POST",headers:{"X-Key":key,...(blob?{}:{"Content-Type":"application/json"})},body:blob?body:JSON.stringify(body)});
  const d=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(d.error||("Error "+r.status));
  return d}
function speak(t){return new Promise(r=>{
  speechSynthesis.cancel();setState("speaking");
  const u=new SpeechSynthesisUtterance(t.replace(/[*_#`]/g,""));
  u.lang=/[\u0900-\u097F]/.test(t)?"hi-IN":"en-IN";
  u.onend=u.onerror=()=>r();speechSynthesis.speak(u)})}
const facts=()=>{try{return JSON.parse(ls("facts")||"[]")}catch(e){return[]}};
async function runTool(t){
  const n=t.name,a=t.args||{};
  if(n==="remember"){const f=facts();f.push(String(a.fact||""));ls("facts",JSON.stringify(f.slice(-50)));return "saved"}
  if(n==="web_search"||n==="get_time")return JSON.stringify(await api("/tool",{name:n,args:a}));
  let r;
  try{r=await fetch("http://127.0.0.1:8765/do",{method:"POST",headers:{"Content-Type":"application/json","X-Key":cfg().key},body:JSON.stringify({tool:n,args:a})})}
  catch(e){return "phone tools server chal nahi raha (Termux mein termux/server.py start karo)"}
  return await r.text()}
async function agent(mode){
  const msgs=hist.slice(-20).map(m=>({role:m.role,content:m.content})),mem=facts();
  for(let i=0;i<4;i++){
    const d=await api("/chat",{messages:msgs,memory:mem,tools:i<3,mode,model:ls("model")||""});
    if(!d.tool_calls||!d.tool_calls.length)return d.reply||"Samajh nahi aaya, dobara bolo.";
    for(const t of d.tool_calls){
      $("#hint").textContent="Tool: "+t.name;
      let out;try{out=await runTool(t)}catch(e){out="error: "+e.message}
      msgs.push({role:"assistant",content:"(maine tool "+t.name+" chalaya)"},{role:"user",content:"Tool "+t.name+" ka result: "+String(out).slice(0,1500)+(mode==="chat"?". Ab user ko poora jawab do.":". Ab user ko chhota jawab do.")})}}
  return "Maaf karo, kaam poora nahi ho paya."}
async function ask(text,voice){
  hist.push({role:"user",content:text});render();setState("thinking");
  const reply=await agent(voice?"voice":"chat");
  hist.push({role:"assistant",content:reply});hist=hist.slice(-40);ls("hist",JSON.stringify(hist));render();
  if(voice)await speak(reply);else setState("idle")}
async function listen(){
  setState("listening");
  stream=stream||await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}});
  const mt=MediaRecorder.isTypeSupported("audio/webm;codecs=opus")?"audio/webm;codecs=opus":"";
  const rec=new MediaRecorder(stream,mt?{mimeType:mt}:{}),chunks=[];
  rec.ondataavailable=e=>chunks.push(e.data);
  const ac=new AudioContext(),an=ac.createAnalyser();an.fftSize=1024;
  ac.createMediaStreamSource(stream).connect(an);
  const buf=new Uint8Array(an.fftSize);let spoke=false,last=Date.now();const t0=last;
  return new Promise(res=>{
    rec.onstop=()=>{ac.close();res(spoke?new Blob(chunks,{type:rec.mimeType}):null)};
    rec.start();
    (function tick(){
      if(state!=="listening"){rec.state!=="inactive"&&rec.stop();return}
      an.getByteTimeDomainData(buf);let m=0;for(const v of buf)m=Math.max(m,Math.abs(v-128));
      const n=Date.now();if(m>14){spoke=true;last=n}
      if((spoke&&n-last>1300)||(!spoke&&n-t0>10000)||n-t0>30000){rec.stop();return}
      requestAnimationFrame(tick)})()})}
async function loop(){
  on=true;
  while(on){
    try{
      const blob=await listen();
      if(!on)break;if(!blob)continue;
      setState("thinking");
      const {text}=await api("/stt",blob);
      if(text&&text.trim())await ask(text.trim(),true);
    }catch(e){err(e);on=false}
  }
  setState("idle")}
$("#orb").onclick=()=>{
  if(on&&state==="speaking"){speechSynthesis.cancel();return}
  if(on){on=false;speechSynthesis.cancel();setState("idle");return}
  loop()};
$("#f").onsubmit=async e=>{e.preventDefault();const t=$("#t").value.trim();if(!t)return;$("#t").value="";
  try{await ask(t,false)}catch(x){err(x);setState("idle")}};
$("#gear").onclick=()=>{$("#url").value=ls("url")||"";$("#key").value=ls("key")||"";$("#model").value=ls("model")||"";$("#dlg").showModal()};
$("#save").onclick=()=>{ls("url",$("#url").value.trim());ls("key",$("#key").value.trim());ls("model",$("#model").value);$("#dlg").close()};
$("#clr").onclick=()=>{hist=[];ls("hist","[]");render();$("#dlg").close()};
render();
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
